version: '3.8'

services:
  # ============ API Gateway ============
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - user_service
      - product_service
      - cart_service
      - order_service
      - payment_service
      - notification_service
    networks:
      - ecommerce-network

  # ============ Microservices ============
  user_service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - USER_DB_HOST=user_db
      - USER_DB_PORT=5432
      - USER_DB_NAME=user_service
      - USER_DB_USER=ecommerce
      - USER_DB_PASSWORD=ecommerce_secret
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key}
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - user_db
      - rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

  product_service:
    build:
      context: .
      dockerfile: services/product_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - PRODUCT_DB_HOST=product_db
      - PRODUCT_DB_PORT=5432
      - PRODUCT_DB_NAME=product_service
      - PRODUCT_DB_USER=ecommerce
      - PRODUCT_DB_PASSWORD=ecommerce_secret
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - product_db
      - rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

  cart_service:
    build:
      context: .
      dockerfile: services/cart_service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PRODUCT_SERVICE_URL=http://product_service:8002
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key}
    depends_on:
      - redis
    networks:
      - ecommerce-network
    restart: unless-stopped

  order_service:
    build:
      context: .
      dockerfile: services/order_service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - ORDER_DB_HOST=order_db
      - ORDER_DB_PORT=5432
      - ORDER_DB_NAME=order_service
      - ORDER_DB_USER=ecommerce
      - ORDER_DB_PASSWORD=ecommerce_secret
      - CART_SERVICE_URL=http://cart_service:8003
      - PRODUCT_SERVICE_URL=http://product_service:8002
      - PAYMENT_SERVICE_URL=http://payment_service:8005
      - RABBITMQ_HOST=rabbitmq
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key}
    depends_on:
      - order_db
      - rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

  payment_service:
    build:
      context: .
      dockerfile: services/payment_service/Dockerfile
    ports:
      - "8005:8005"
    environment:
      - PAYMENT_DB_HOST=payment_db
      - PAYMENT_DB_PORT=5432
      - PAYMENT_DB_NAME=payment_service
      - PAYMENT_DB_USER=ecommerce
      - PAYMENT_DB_PASSWORD=ecommerce_secret
      - ORDER_SERVICE_URL=http://order_service:8004
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_xxx}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_xxx}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key}
    depends_on:
      - payment_db
    networks:
      - ecommerce-network
    restart: unless-stopped

  notification_service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    ports:
      - "8006:8006"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-noreply@example.com}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM_PHONE=${TWILIO_FROM_PHONE:-}
    depends_on:
      - rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ============ Databases ============
  user_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=ecommerce_secret
      - POSTGRES_DB=user_service
    volumes:
      - user_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - ecommerce-network
    restart: unless-stopped

  product_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=ecommerce_secret
      - POSTGRES_DB=product_service
    volumes:
      - product_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - ecommerce-network
    restart: unless-stopped

  order_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=ecommerce_secret
      - POSTGRES_DB=order_service
    volumes:
      - order_db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - ecommerce-network
    restart: unless-stopped

  payment_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=ecommerce_secret
      - POSTGRES_DB=payment_service
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ============ Redis (Cart) ============
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ============ RabbitMQ (Message Queue) ============
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

networks:
  ecommerce-network:
    driver: bridge

volumes:
  user_db_data:
  product_db_data:
  order_db_data:
  payment_db_data:
  redis_data:
  rabbitmq_data:
