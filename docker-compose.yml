version: '3.8'

# =============================================================================
# E-Commerce Platform Docker Compose
# =============================================================================
# This configuration uses CLOUD SERVICES from .env:
# - PostgreSQL: Neon (cloud) 
# - Redis: Redis Cloud
# - Email: Brevo
# - Payments: Stripe
# =============================================================================

services:
  # ============ Message Broker ============
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=ecommerce
      - RABBITMQ_DEFAULT_PASS=ecommerce_secret
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============ API Gateway ============
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - user_service
      - product_service
      - cart_service
      - order_service
      - payment_service
      - notification_service
      - rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

  # ============ Microservices ============

  user_service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # Override service URLs for Docker network
      - USER_SERVICE_URL=http://user_service:8001
      - PRODUCT_SERVICE_URL=http://product_service:8002
      - CART_SERVICE_URL=http://cart_service:8003
      - ORDER_SERVICE_URL=http://order_service:8004
      - PAYMENT_SERVICE_URL=http://payment_service:8005
      - NOTIFICATION_SERVICE_URL=http://notification_service:8006
      - RABBITMQ_URL=amqp://ecommerce:ecommerce_secret@rabbitmq:5672/
    depends_on:
      - rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

  product_service:
    build:
      context: .
      dockerfile: services/product_service/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - USER_SERVICE_URL=http://user_service:8001
      - PRODUCT_SERVICE_URL=http://product_service:8002
      - CART_SERVICE_URL=http://cart_service:8003
      - ORDER_SERVICE_URL=http://order_service:8004
      - PAYMENT_SERVICE_URL=http://payment_service:8005
      - NOTIFICATION_SERVICE_URL=http://notification_service:8006
      - RABBITMQ_URL=amqp://ecommerce:ecommerce_secret@rabbitmq:5672/
    depends_on:
      - rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

  cart_service:
    build:
      context: .
      dockerfile: services/cart_service/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - USER_SERVICE_URL=http://user_service:8001
      - PRODUCT_SERVICE_URL=http://product_service:8002
      - CART_SERVICE_URL=http://cart_service:8003
      - ORDER_SERVICE_URL=http://order_service:8004
      - PAYMENT_SERVICE_URL=http://payment_service:8005
      - NOTIFICATION_SERVICE_URL=http://notification_service:8006
      - RABBITMQ_URL=amqp://ecommerce:ecommerce_secret@rabbitmq:5672/
    depends_on:
      - rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

  order_service:
    build:
      context: .
      dockerfile: services/order_service/Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      - USER_SERVICE_URL=http://user_service:8001
      - PRODUCT_SERVICE_URL=http://product_service:8002
      - CART_SERVICE_URL=http://cart_service:8003
      - ORDER_SERVICE_URL=http://order_service:8004
      - PAYMENT_SERVICE_URL=http://payment_service:8005
      - NOTIFICATION_SERVICE_URL=http://notification_service:8006
      - RABBITMQ_URL=amqp://ecommerce:ecommerce_secret@rabbitmq:5672/
    depends_on:
      - rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

  payment_service:
    build:
      context: .
      dockerfile: services/payment_service/Dockerfile
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      - USER_SERVICE_URL=http://user_service:8001
      - PRODUCT_SERVICE_URL=http://product_service:8002
      - CART_SERVICE_URL=http://cart_service:8003
      - ORDER_SERVICE_URL=http://order_service:8004
      - PAYMENT_SERVICE_URL=http://payment_service:8005
      - NOTIFICATION_SERVICE_URL=http://notification_service:8006
      - RABBITMQ_URL=amqp://ecommerce:ecommerce_secret@rabbitmq:5672/
    depends_on:
      - rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

  notification_service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      - USER_SERVICE_URL=http://user_service:8001
      - PRODUCT_SERVICE_URL=http://product_service:8002
      - CART_SERVICE_URL=http://cart_service:8003
      - ORDER_SERVICE_URL=http://order_service:8004
      - PAYMENT_SERVICE_URL=http://payment_service:8005
      - NOTIFICATION_SERVICE_URL=http://notification_service:8006
      - RABBITMQ_URL=amqp://ecommerce:ecommerce_secret@rabbitmq:5672/
    depends_on:
      - rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped

networks:
  ecommerce-network:
    driver: bridge
