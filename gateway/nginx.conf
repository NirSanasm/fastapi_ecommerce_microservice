# E-commerce Platform API Gateway Configuration
# Routes requests to appropriate microservices

events {
    worker_connections 1024;
}

http {
    # Upstream definitions for each microservice
    upstream user_service {
        server user_service:8001;
    }

    upstream product_service {
        server product_service:8002;
    }

    upstream cart_service {
        server cart_service:8003;
    }

    upstream order_service {
        server order_service:8004;
    }

    upstream payment_service {
        server payment_service:8005;
    }

    upstream notification_service {
        server notification_service:8006;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check for gateway
        location /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # User Service routes
        location /api/v1/auth {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/users {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Product Service routes
        location /api/v1/products {
            proxy_pass http://product_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/categories {
            proxy_pass http://product_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cart Service routes
        location /api/v1/cart {
            proxy_pass http://cart_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Order Service routes
        location /api/v1/orders {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Payment Service routes
        location /api/v1/payments {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notification Service routes
        location /api/v1/notifications {
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Direct service documentation access
        location /docs/users {
            proxy_pass http://user_service/docs;
        }

        location /docs/products {
            proxy_pass http://product_service/docs;
        }

        location /docs/cart {
            proxy_pass http://cart_service/docs;
        }

        location /docs/orders {
            proxy_pass http://order_service/docs;
        }

        location /docs/payments {
            proxy_pass http://payment_service/docs;
        }

        location /docs/notifications {
            proxy_pass http://notification_service/docs;
        }

        # Default - API info
        location / {
            return 200 '{"message":"E-commerce Platform API Gateway","version":"1.0.0","endpoints":{"/api/v1/auth":"User authentication","/api/v1/users":"User management","/api/v1/products":"Product catalog","/api/v1/categories":"Product categories","/api/v1/cart":"Shopping cart","/api/v1/orders":"Order management","/api/v1/payments":"Payment processing","/api/v1/notifications":"Notifications"}}';
            add_header Content-Type application/json;
        }
    }
}
